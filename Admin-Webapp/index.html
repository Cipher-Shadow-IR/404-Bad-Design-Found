<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Submission Review</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="logo">TechXtreme Challenge </h2>
    <nav>
      <a class="active">Dashboard</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main">

    <!-- Topbar -->
    <header class="topbar">
      <h1>404 Not Found</h1>
      <div class="admin">
        <span>Admin</span>
        <button class="logout">Logout</button>
      </div>
    </header>

    <!-- Page Title -->
    <section class="title-row">
      <div>
        
      </div>
      <button class="refresh">Refresh Data</button>
    </section>

    <!-- Table Section -->
    <section class="card">
      <div class="search-row">
        <input placeholder="Search teams..." />
      </div>

      <table>
        <thead>
          <tr>
            <th>Team</th>
            <th>Unlocked</th>
            <th>Time Taken</th>
            <th>Preview</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Alpha Squad</td>
            <td>6 / 12 🔒</td>
            <td>15:20</td>
            <td><button class="view">View Design</button></td>
          </tr>

          <tr>
            <td>Design Mavericks</td>
            <td>6 / 12 🔒</td>
            <td>18:50</td>
            <td><button class="view">View Design</button></td>
          </tr>

          <tr>
            <td>Pixel Pioneers</td>
            <td>6 / 12 🔒</td>
            <td>17:20</td>
            <td><button class="view">View Design</button></td>
          </tr>

          <tr>
            <td>Creative Coders</td>
            <td>6 / 12 🔒</td>
            <td>18:50</td>
            <td><button class="view">View Design</button></td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Summary -->
    <section class="summary">
      <div class="summary-card">
        <h3>Total Teams</h3>
        <p>40</p>
      </div>

      <div class="summary-card">
        <h3>Reviewed</h3>
        <p>14</p>
      </div>

      <div class="summary-card">
        <h3>Pending</h3>
        <p>6</p>
      </div>
    </section>

  </main>
</div>

</body>
</html>

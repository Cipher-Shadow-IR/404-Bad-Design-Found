<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — 404: Bad Design Found</title>
  <link rel="icon" type="image/jpeg" href="http://localhost:3000/Assets/Elements/free_elements/404BDNF_logo.jpeg">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="page-wrapper">

    <!-- ====== TOPBAR (matches builder) ====== -->
    <header class="topbar">
      <div class="brand">
        <div class="logo"><img src="http://localhost:3000/Assets/Elements/free_elements/404BDNF_logo.jpeg" alt="Logo">
        </div>
        <div class="brand-text">
          <div class="title">ADMIN PANEL</div>
          <div class="subtitle">404: Bad Design Found</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="pill" id="live-clock">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <b id="clock-time">--:--</b>
        </div>
        <div class="pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Teams: <b id="pill-team-count">0</b>
        </div>
        <button class="btn btn-ghost" onclick="loadAll()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
          Refresh
        </button>
      </div>
    </header>

    <!-- ====== STATS ROW ====== -->
    <section class="stats-row">
      <div class="stat-card">
        <div class="stat-icon-box blue">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-label">Total Teams</div>
          <div class="stat-value" id="stat-total">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-box green">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-label">Submitted</div>
          <div class="stat-value green" id="stat-submitted">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-box yellow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-label">Pending</div>
          <div class="stat-value yellow" id="stat-pending">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-box red">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-label">Disqualified</div>
          <div class="stat-value red" id="stat-disqualified">—</div>
        </div>
      </div>
    </section>

    <!-- ====== MAIN TABLE PANEL ====== -->
    <main class="main-panel">
      <div class="panel-head">
        <span>Submission Review</span>
      </div>

      <div class="panel-toolbar">
        <div class="tab-bar">
          <button class="tab active" data-tab="all" onclick="switchTab('all')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
            </svg>
            All Teams
          </button>
          <button class="tab" data-tab="submitted" onclick="switchTab('submitted')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
            Submitted
          </button>
          <button class="tab" data-tab="pending" onclick="switchTab('pending')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            Pending
          </button>
        </div>
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input id="search-input" placeholder="Search teams..." oninput="filterTable()" />
        </div>
      </div>

      <div class="table-scroll">
        <div id="loading" class="loading-msg">Loading teams...</div>
        <div id="empty" class="loading-msg" style="display:none">No teams found yet.</div>

        <table id="teams-table" style="display:none">
          <thead>
            <tr>
              <th>#</th>
              <th>Team</th>
              <th>Phone</th>
              <th>Quiz</th>
              <th>Unlocked</th>
              <th>Time</th>
              <th>Status</th>
              <th>Preview</th>
            </tr>
          </thead>
          <tbody id="teams-body"></tbody>
        </table>
      </div>
    </main>

  </div>

  <!-- ====== DESIGN PREVIEW MODAL ====== -->
  <div class="modal-overlay" id="design-modal" onclick="closeDesignModal(event)">
    <div class="modal-box design-modal-box">
      <button class="modal-close" onclick="closePreview()">&times;</button>
      <div id="design-modal-body"></div>
    </div>
  </div>

  <!-- ====== TEAM DETAIL MODAL ====== -->
  <div class="modal-overlay" id="team-modal" onclick="closeTeamModal(event)">
    <div class="modal-box">
      <button class="modal-close"
        onclick="document.getElementById('team-modal').classList.remove('open')">&times;</button>
      <h2 id="modal-title">Team Details</h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const API = "http://localhost:4000";
    const GAME_SERVER = "http://localhost:3000";
    let allTeams = [];
    let currentTab = "all";

    // ====== CLOCK ======
    function updateClock() {
      const now = new Date();
      document.getElementById("clock-time").textContent =
        now.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ====== LOAD ALL ======
    async function loadAll() {
      try {
        await Promise.all([loadTeams(), loadStats()]);
      } catch (e) {
        console.error("Server might not be running:", e);
      }
    }

    // ====== LOAD TEAMS ======
    async function loadTeams() {
      const loading = document.getElementById("loading");
      const empty = document.getElementById("empty");
      const table = document.getElementById("teams-table");

      loading.style.display = "block";
      empty.style.display = "none";
      table.style.display = "none";

      try {
        const res = await fetch(`${API}/admin/api/teams`);
        allTeams = await res.json();
        document.getElementById("pill-team-count").textContent = allTeams.length;

        if (allTeams.length === 0) {
          loading.style.display = "none";
          empty.style.display = "block";
          return;
        }

        renderTable(getFilteredTeams());
        loading.style.display = "none";
        table.style.display = "table";
      } catch (e) {
        loading.textContent = "⚠ Could not connect to server.";
        console.error(e);
      }
    }

    // ====== TAB SWITCHING ======
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add("active");
      renderTable(getFilteredTeams());
    }

    function getFilteredTeams() {
      const q = (document.getElementById("search-input").value || "").toLowerCase();
      let teams = allTeams;

      if (currentTab === "submitted") {
        teams = teams.filter(t => (t.submitted === 1 || t.submitted === true));
      } else if (currentTab === "pending") {
        teams = teams.filter(t => !(t.submitted === 1 || t.submitted === true));
      }

      if (q) {
        teams = teams.filter(t => t.team_name.toLowerCase().includes(q) || (t.phone || "").includes(q));
      }
      return teams;
    }

    function filterTable() {
      renderTable(getFilteredTeams());
    }

    // ====== RENDER TABLE ======
    function renderTable(teams) {
      const tbody = document.getElementById("teams-body");
      const table = document.getElementById("teams-table");
      tbody.innerHTML = "";

      if (teams.length === 0) {
        table.style.display = "none";
        document.getElementById("empty").style.display = "block";
        document.getElementById("empty").textContent = currentTab === "submitted"
          ? "No submissions yet."
          : currentTab === "pending"
            ? "All teams have submitted!"
            : "No teams found.";
        return;
      }

      document.getElementById("empty").style.display = "none";
      table.style.display = "table";

      teams.forEach((t, i) => {
        const tr = document.createElement("tr");
        const globalIdx = allTeams.indexOf(t);

        const isSubmitted = t.submitted === 1 || t.submitted === true;
        const isBlocked = t.is_blocked === 1 || t.is_blocked === true;
        const cheated = t.cheated || false;
        const isDisqualified = isBlocked || cheated;

        // Time
        let timeTaken = "—";
        if (t.time_taken_seconds) {
          const mins = Math.floor(t.time_taken_seconds / 60);
          const secs = t.time_taken_seconds % 60;
          timeTaken = `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
        } else if (t.time_taken) {
          const ts = Math.floor(t.time_taken / 1000);
          timeTaken = `${String(Math.floor(ts / 60)).padStart(2, "0")}:${String(ts % 60).padStart(2, "0")}`;
        } else if (t.start_time && !isSubmitted) {
          const elapsed = Date.now() - t.start_time;
          const mins = Math.floor(elapsed / 60000);
          const secs = Math.floor((elapsed % 60000) / 1000);
          timeTaken = `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")} (live)`;
        }

        // Quiz
        const qa = t.quiz ? t.quiz.total_attempted : (t.total_attempted || 0);
        const qc = t.quiz ? t.quiz.total_correct : (t.total_correct || 0);
        const quizDisplay = isSubmitted ? `${qc}/${qa}` : "—";
        const quizClass = qc >= 3 ? "good" : qc >= 1 ? "mid" : "low";

        // Unlocked
        const unlocked = t.unlocked_count || 0;

        // Status
        let statusHTML = "";
        if (isDisqualified) {
          statusHTML = `<span class="status-pill dq"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg> DISQUALIFIED</span>`;
        } else if (isSubmitted) {
          statusHTML = `<span class="status-pill done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> Submitted</span>`;
        } else {
          statusHTML = `<span class="status-pill active"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Active</span>`;
        }

        if (isDisqualified) tr.classList.add("row-dq");

        tr.innerHTML = `
      <td class="col-num">${i + 1}</td>
      <td class="col-team">${escapeHtml(t.team_name)}</td>
      <td class="col-phone">${t.phone || "—"}</td>
      <td><span class="quiz-chip ${isSubmitted ? quizClass : ''}">${quizDisplay}</span></td>
      <td>${unlocked} / 5</td>
      <td>${timeTaken}</td>
      <td>${statusHTML}</td>
      <td>
        <button class="btn-preview" onclick="viewDesign(${globalIdx})" ${!isSubmitted ? 'disabled' : ''}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          View
        </button>
      </td>
    `;
        tbody.appendChild(tr);
      });
    }

    // ====== VIEW DESIGN ======
    function viewDesign(index) {
      const team = allTeams[index];
      if (!team) return;

      const modal = document.getElementById("design-modal");
      const body = document.getElementById("design-modal-body");

      const teamName = team.team_name || "Unknown";
      const unlocked = team.unlocked_count || 0;
      const cheated = team.cheated || false;
      const cheatCount = team.cheat_count || 0;
      const isBlocked = team.is_blocked === 1 || team.is_blocked === true;
      const isDisqualified = isBlocked || cheated;
      const initial = teamName.charAt(0).toUpperCase();

      const qa = team.quiz ? team.quiz.total_attempted : (team.total_attempted || 0);
      const qc = team.quiz ? team.quiz.total_correct : (team.total_correct || 0);

      let timeStr = "—";
      if (team.time_taken_seconds) {
        const m = Math.floor(team.time_taken_seconds / 60);
        const s = team.time_taken_seconds % 60;
        timeStr = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      } else if (team.time_taken) {
        const ts = Math.floor(team.time_taken / 1000);
        timeStr = `${String(Math.floor(ts / 60)).padStart(2, "0")}:${String(ts % 60).padStart(2, "0")}`;
      }

      const submittedAt = team.submission_time_readable || (team.submission_timestamp ? new Date(team.submission_timestamp).toLocaleString() : '—');
      const designElements = team.design || team.canvas_elements || [];
      const origW = team.canvas_width || 960;
      const origH = team.canvas_height || 540;
      const previewW = 710; // modal inner width
      const scale = previewW / origW;
      const previewH = Math.round(origH * scale);

      let canvasHTML = '';
      if (designElements.length > 0) {
        canvasHTML = designElements.map(el => {
          const src = el.src || el.element_src || '';
          const x = (el.x || el.x_coordinate || 0) * scale;
          const y = (el.y || el.y_coordinate || 0) * scale;
          const w = (el.w || el.width || 120) * scale;
          const h = (el.h || el.height || 80) * scale;
          const z = el.z_index || el.zIndex || 1;
          const fullSrc = src.startsWith('http') ? src : `${GAME_SERVER}${src}`;
          return `<div class="design-el" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${w.toFixed(1)}px;height:${h.toFixed(1)}px;z-index:${z}">
        <img src="${fullSrc}" alt="element" onerror="this.style.display='none'" />
      </div>`;
        }).join('');
      } else {
        canvasHTML = `<div class="canvas-empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.4"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span>No design elements found</span>
    </div>`;
      }

      let integrityBadge = '';
      if (isDisqualified) {
        integrityBadge = `<span class="integrity-badge dq">DISQUALIFIED (${cheatCount} violation${cheatCount !== 1 ? 's' : ''})</span>`;
      } else if (cheatCount > 0) {
        integrityBadge = `<span class="integrity-badge warn">${cheatCount} warning(s)</span>`;
      } else {
        integrityBadge = `<span class="integrity-badge fair">Fair Play</span>`;
      }

      body.innerHTML = `
    <div class="dm-header">
      <div class="dm-avatar">${initial}</div>
      <div class="dm-info">
        <div class="dm-name">${escapeHtml(teamName)}</div>
        <div class="dm-meta">
          <span>${team.phone || '—'}</span>
          <span>·</span>
          <span>Unlocked: ${unlocked}/5</span>
          <span>·</span>
          <span>Time: ${timeStr}</span>
        </div>
      </div>
      ${integrityBadge}
    </div>
    <div class="dm-chips">
      <div class="dm-chip">
        <div class="dm-chip-label">Quiz Score</div>
        <div class="dm-chip-value">${qc} / ${qa}</div>
      </div>
      <div class="dm-chip">
        <div class="dm-chip-label">Elements Used</div>
        <div class="dm-chip-value">${designElements.length}</div>
      </div>
      <div class="dm-chip">
        <div class="dm-chip-label">Submitted At</div>
        <div class="dm-chip-value small">${submittedAt}</div>
      </div>
    </div>
    <div class="dm-canvas" style="width:${previewW}px;height:${previewH}px;">
      ${canvasHTML}
    </div>
  `;

      modal.classList.add("open");
    }

    function closePreview() { document.getElementById("design-modal").classList.remove("open"); }
    function closeDesignModal(e) { if (e.target === document.getElementById("design-modal")) closePreview(); }
    function closeTeamModal(e) { if (e.target === document.getElementById("team-modal")) document.getElementById("team-modal").classList.remove("open"); }

    // ====== LOAD STATS ======
    async function loadStats() {
      try {
        const res = await fetch(`${API}/admin/api/stats`);
        const stats = await res.json();
        document.getElementById("stat-total").textContent = stats.total_teams;
        document.getElementById("stat-submitted").textContent = stats.submitted;
        document.getElementById("stat-pending").textContent = stats.pending;

        // Count disqualified
        const dqCount = allTeams.filter(t => t.is_blocked === 1 || t.is_blocked === true || t.cheated === true).length;
        document.getElementById("stat-disqualified").textContent = dqCount;
      } catch (e) {
        console.error("Failed to load stats:", e);
      }
    }

    // ====== HELPERS ======
    function escapeHtml(str) {
      if (!str) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // ====== INIT ======
    loadAll();
    setInterval(loadAll, 10000);
  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 NOT FOUND - Round 1</title>
  <link rel="stylesheet" href="./builder-styles.css" />
</head>

<body>

<div class="page-wrapper">

  <header class="topbar">
    <div class="brand">
      <div class="logo">W</div>
      <div class="brand-text">
        <div class="title">404 NOT FOUND</div>
        <div class="subtitle">TechXtreme Challenge</div>
      </div>
    </div>

    <div class="topbar-right">
      <div class="pill">Time Left : <b id="timer">20:00</b></div>
      <div class="pill">Team: <b id="team-name"></b></div>
      <button class="btn btn-ghost" id="logout-btn">Logout</button>
    </div>
  </header>

  <section class="problem">
    <div class="problem-pill">
      <b>Problem Statement</b>
      <span>Design a Travel Blog Homepage for Adventurers!</span>
    </div>
  </section>

  <main class="app">

    <!-- Left Panel -->
    <aside class="panel left">
      <div class="panel-head">Elements Panel</div>

      <div class="panel-body">
        <h4 class="panel-title">Available Elements</h4>
        <div class="elements" id="elements-container"></div>
      </div>
    </aside>

    <!-- Canvas -->
    <section class="canvas">
      <div class="canvas-window">
        <div class="canvas-head">
          <h2>Design Canvas</h2>
        </div>

        <div class="canvas-body">
          <div id="drop-zone" class="drop-zone">
            <div class="drop-zone-hint">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
              </svg>
              <span>Drag & Drop Elements Here</span>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="bottom">
    <div class="status-card">
      <div class="status-top">
        <span class="tick">✓</span>
        <b>Elements Placed :</b> <span id="placed-count">0</span>
      </div>
      <div class="bar">
        <div class="fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <button class="submit" id="submit-btn">Submit Your Design</button>

    <div class="quiz-status">
      <span class="quiz-icon">🧠</span>
      <b>Quiz Attempted :</b> <span id="quiz-counter">0 / 0</span>
    </div>
  </footer>

</div>

<script src="./builder-scripts.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI/UX Warriors Quiz – 160 Questions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0d17;
      --surface:   rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.08);
      --accent:    #7c6cf8;
      --accent2:   #5ecbf0;
      --easy:      #4ade80;
      --medium:    #facc15;
      --hard:      #f97316;
      --advanced:  #e879f9;
      --correct:   rgba(74,222,128,0.18);
      --wrong:     rgba(239,68,68,0.18);
      --text:      #e2e8f0;
      --muted:     #94a3b8;
      --radius:    16px;
      --shadow:    0 8px 32px rgba(0,0,0,0.45);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Background blobs ─────────────────────────── */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #7c6cf830 0%, transparent 70%);
      top: -200px; left: -200px;
    }
    body::after {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #5ecbf020 0%, transparent 70%);
      bottom: -150px; right: -150px;
    }

    /* ─── Hero Header ──────────────────────────────── */
    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 64px 24px 40px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(124,108,248,0.15);
      border: 1px solid rgba(124,108,248,0.35);
      border-radius: 999px;
      padding: 6px 18px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 70%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.15;
      margin-bottom: 14px;
    }
    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 540px;
      margin: 0 auto 28px;
    }

    /* ─── Progress bar ─────────────────────────────── */
    .progress-wrap {
      max-width: 700px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .progress-bar-bg {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.07);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .progress-label {
      font-size: 0.82rem;
      color: var(--muted);
      min-width: 80px;
      text-align: right;
    }

    /* ─── Legend ───────────────────────────────────── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }

    /* ─── Grid ─────────────────────────────────────── */
    .quiz-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* ─── Question Card ────────────────────────────── */
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 20px 18px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeUp 0.4s ease both;
    }
    .q-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.55);
      border-color: rgba(124,108,248,0.3);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* stagger animations – first 40 cards only for perf */
    .q-card:nth-child(1)  { animation-delay: 0.02s; }
    .q-card:nth-child(2)  { animation-delay: 0.04s; }
    .q-card:nth-child(3)  { animation-delay: 0.06s; }
    .q-card:nth-child(4)  { animation-delay: 0.08s; }
    .q-card:nth-child(5)  { animation-delay: 0.10s; }
    .q-card:nth-child(6)  { animation-delay: 0.12s; }
    .q-card:nth-child(7)  { animation-delay: 0.14s; }
    .q-card:nth-child(8)  { animation-delay: 0.16s; }

    /* answered states */
    .q-card.answered-correct { border-color: rgba(74,222,128,0.45); background: var(--correct); }
    .q-card.answered-wrong   { border-color: rgba(239,68,68,0.45);  background: var(--wrong); }

    /* card header */
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .q-number {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      background: rgba(124,108,248,0.12);
      border: 1px solid rgba(124,108,248,0.25);
      border-radius: 8px;
      padding: 3px 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .level-badge {
      font-size: 0.68rem;
      font-weight: 600;
      border-radius: 999px;
      padding: 3px 10px;
      text-transform: capitalize;
      white-space: nowrap;
    }
    .level-easy     { background: rgba(74,222,128,0.15); color: var(--easy);     border: 1px solid rgba(74,222,128,0.3); }
    .level-medium   { background: rgba(250,204,21,0.15); color: var(--medium);   border: 1px solid rgba(250,204,21,0.3); }
    .level-hard     { background: rgba(249,115,22,0.15); color: var(--hard);     border: 1px solid rgba(249,115,22,0.3); }
    .level-advanced { background: rgba(232,121,249,0.15);color: var(--advanced); border: 1px solid rgba(232,121,249,0.3); }

    /* question text */
    .q-text {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.55;
      color: var(--text);
    }

    /* options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 9px 13px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      color: var(--text);
      text-align: left;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      width: 100%;
    }
    .option-btn:hover:not(:disabled) {
      background: rgba(124,108,248,0.12);
      border-color: rgba(124,108,248,0.4);
      transform: translateX(3px);
    }
    .option-btn .opt-label {
      flex-shrink: 0;
      width: 22px; height: 22px;
      border-radius: 6px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
    }
    .option-btn.selected {
      background: rgba(124,108,248,0.18);
      border-color: var(--accent);
    }
    .option-btn.selected .opt-label {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .option-btn.correct-ans {
      background: rgba(74,222,128,0.15);
      border-color: var(--easy);
    }
    .option-btn.correct-ans .opt-label { background: var(--easy); color: #0b0d17; border-color: var(--easy); }
    .option-btn.wrong-ans {
      background: rgba(239,68,68,0.15);
      border-color: #ef4444;
    }
    .option-btn.wrong-ans .opt-label { background: #ef4444; color: #fff; border-color: #ef4444; }
    .option-btn:disabled { cursor: default; }

    /* feedback pill */
    .feedback {
      display: none;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      width: fit-content;
    }
    .feedback.show { display: block; }
    .feedback.right { background: rgba(74,222,128,0.2); color: var(--easy); }
    .feedback.wrong { background: rgba(239,68,68,0.2);  color: #f87171; }

    /* ─── Submit Section ───────────────────────────── */
    .submit-section {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px 24px 80px;
    }
    .submit-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 18px 56px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #5ecbf0);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(124,108,248,0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      letter-spacing: 0.02em;
      overflow: hidden;
    }
    .submit-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #fff2, transparent);
    }
    .submit-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 48px rgba(124,108,248,0.6);
    }
    .submit-btn:active { transform: scale(0.98); }

    /* ─── Result Modal ─────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #131626;
      border: 1px solid rgba(124,108,248,0.35);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .modal-emoji { font-size: 3.5rem; margin-bottom: 16px; }
    .modal-title {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    .modal-score {
      font-size: 3.4rem;
      font-weight: 700;
      color: var(--accent2);
      line-height: 1;
      margin-bottom: 6px;
    }
    .modal-sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }
    .stat-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 10px;
    }
    .stat-box .val { font-size: 1.5rem; font-weight: 700; }
    .stat-box .lbl { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .stat-box.s-correct .val { color: var(--easy); }
    .stat-box.s-wrong   .val { color: #f87171; }
    .stat-box.s-skip    .val { color: var(--muted); }
    .modal-actions { display: flex; gap: 12px; justify-content: center; }
    .btn-retry {
      padding: 12px 32px;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-retry.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      box-shadow: 0 6px 24px rgba(124,108,248,0.4);
    }
    .btn-retry.primary:hover { transform: translateY(-2px); }
    .btn-retry.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-retry.ghost:hover { background: rgba(255,255,255,0.05); color: var(--text); }

    /* ─── Sticky mini progress ─────────────────────── */
    .sticky-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.05);
      z-index: 50;
    }
    .sticky-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.3s ease;
    }

    /* ─── Responsive ───────────────────────────────── */
    @media (max-width: 600px) {
      .quiz-grid { grid-template-columns: 1fr; padding: 0 14px 50px; }
      .modal-box { padding: 32px 22px; }
      .modal-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Sticky top progress -->
<div class="sticky-bar"><div class="sticky-bar-fill" id="stickyFill"></div></div>

<!-- Hero -->
<header class="hero">
  <div class="hero-badge">⚡ UI/UX Warriors</div>
  <h1>Scenario-Based Quiz</h1>
  <p>160 carefully crafted questions across Easy, Medium, Hard & Advanced levels. Test your UI/UX knowledge!</p>

  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 160 answered</div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:var(--easy)"></span> Easy</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--medium)"></span> Medium</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--hard)"></span> Hard</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--advanced)"></span> Advanced</div>
  </div>
</header>

<!-- Question Grid -->
<main class="quiz-grid" id="quizGrid">
  <!-- Cards injected by JS -->
</main>

<!-- Submit -->
<section class="submit-section">
  <button class="submit-btn" id="submitBtn" onclick="submitQuiz()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    Submit Quiz
  </button>
</section>

<!-- Result Modal -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <div class="modal-emoji" id="modalEmoji">🎉</div>
    <div class="modal-title" id="modalTitle">Quiz Complete!</div>
    <div class="modal-score" id="modalScore">0%</div>
    <div class="modal-sub" id="modalSub">You scored 0 out of 160</div>
    <div class="modal-stats">
      <div class="stat-box s-correct">
        <div class="val" id="statCorrect">0</div>
        <div class="lbl">Correct ✅</div>
      </div>
      <div class="stat-box s-wrong">
        <div class="val" id="statWrong">0</div>
        <div class="lbl">Wrong ❌</div>
      </div>
      <div class="stat-box s-skip">
        <div class="val" id="statSkip">0</div>
        <div class="lbl">Skipped ⏭</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-retry primary" onclick="retryQuiz()">🔄 Retry</button>
      <button class="btn-retry ghost"   onclick="closeModal()">Review Answers</button>
    </div>
  </div>
</div>

<script>
/* ── Load quiz data ─────────────────────────────────── */
const LABELS = ['A','B','C','D'];

// State
let answers   = {};   // { questionId: selectedOption }
let totalQ    = 0;

async function loadQuiz() {
  try {
    const res  = await fetch('ir.json');
    const data = await res.json();
    totalQ = data.questions.length;
    renderCards(data.questions);
    updateProgress();
  } catch(e) {
    document.getElementById('quizGrid').innerHTML =
      '<p style="color:#f87171;text-align:center;grid-column:1/-1;padding:40px">⚠️ Could not load ir.json. Make sure both files are in the same folder.</p>';
  }
}

/* ── Render all cards ───────────────────────────────── */
function renderCards(questions) {
  const grid = document.getElementById('quizGrid');
  grid.innerHTML = '';
  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `card-${q.id}`;

    const optionsHTML = q.options.map((opt, i) => `
      <button class="option-btn"
              id="opt-${q.id}-${i}"
              onclick="selectOption(${q.id}, '${escHtml(opt)}', '${escHtml(q.answer)}', ${i})"
              data-val="${escHtml(opt)}">
        <span class="opt-label">${LABELS[i]}</span>
        <span>${escHtml(opt)}</span>
      </button>`).join('');

    card.innerHTML = `
      <div class="card-header">
        <span class="q-number">Q ${idx + 1}</span>
        <span class="level-badge level-${q.level}">${q.level}</span>
      </div>
      <p class="q-text">${escHtml(q.question)}</p>
      <div class="options-list">${optionsHTML}</div>
      <div class="feedback" id="fb-${q.id}"></div>`;

    grid.appendChild(card);
  });
}

/* ── Option selection ───────────────────────────────── */
function selectOption(qId, chosen, correct, optIdx) {
  const card = document.getElementById(`card-${qId}`);
  if (card.dataset.locked) return;   // already answered
  card.dataset.locked = '1';

  answers[qId] = chosen;

  const isCorrect = chosen === correct;

  // Style selected button
  const selectedBtn = document.getElementById(`opt-${qId}-${optIdx}`);
  selectedBtn.classList.add(isCorrect ? 'correct-ans' : 'wrong-ans');
  selectedBtn.classList.add('selected');

  // If wrong, reveal correct answer
  if (!isCorrect) {
    card.querySelectorAll('.option-btn').forEach(btn => {
      if (btn.dataset.val === correct) btn.classList.add('correct-ans');
    });
  }

  // Disable all options
  card.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

  // Card border color
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  // Feedback pill
  const fb = document.getElementById(`fb-${qId}`);
  fb.textContent = isCorrect ? '✅ Correct!' : `❌ Correct: ${correct}`;
  fb.className   = `feedback show ${isCorrect ? 'right' : 'wrong'}`;

  updateProgress();
}

/* ── Progress ───────────────────────────────────────── */
function updateProgress() {
  const answered  = Object.keys(answers).length;
  const pct       = totalQ ? Math.round((answered / totalQ) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stickyFill').style.width   = pct + '%';
  document.getElementById('progressLabel').textContent = `${answered} / ${totalQ} answered`;
}

/* ── Submit ─────────────────────────────────────────── */
function submitQuiz() {
  let correct = 0, wrong = 0, skip = 0;

  document.querySelectorAll('.q-card').forEach(card => {
    const qId    = parseInt(card.id.split('-')[1]);
    if (answers[qId] === undefined) {
      skip++;
    } else {
      // Determine correctness from card class
      if (card.classList.contains('answered-correct')) correct++;
      else wrong++;
    }
  });

  const total = correct + wrong + skip;
  const pct   = total ? Math.round((correct / total) * 100) : 0;

  document.getElementById('modalScore').textContent = pct + '%';
  document.getElementById('modalSub').textContent   = `You scored ${correct} out of ${total}`;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent   = wrong;
  document.getElementById('statSkip').textContent    = skip;

  // Emoji & title based on score
  let emoji, title;
  if (pct >= 90)      { emoji = '🏆'; title = 'Outstanding!'; }
  else if (pct >= 75) { emoji = '🎉'; title = 'Great Job!'; }
  else if (pct >= 55) { emoji = '👍'; title = 'Good Effort!'; }
  else if (pct >= 35) { emoji = '📚'; title = 'Keep Practicing!'; }
  else                { emoji = '💪'; title = 'Don\'t Give Up!'; }

  document.getElementById('modalEmoji').textContent = emoji;
  document.getElementById('modalTitle').textContent = title;

  document.getElementById('resultModal').classList.add('show');
}

function closeModal() { document.getElementById('resultModal').classList.remove('show'); }

function retryQuiz() {
  answers = {};
  closeModal();
  location.reload();
}

/* ── Escape HTML ─────────────────────────────────────── */
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ── Boot ───────────────────────────────────────────── */
loadQuiz();
</script>
</body>
</html>
